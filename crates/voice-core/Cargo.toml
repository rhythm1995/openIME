[package]
name = "voice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform voice-input engine core (no Tauri dependency)"

[features]
default = []
# 本地 sherpa-onnx ASR（重型原生依赖，按需开启）。
sherpa = ["dep:sherpa-onnx"]
# 本地 GGUF 润色/翻译（llama.cpp，编译较重；encoding_rs 供 token_to_piece 解码）。
llm = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
tokio-tungstenite = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
hound = "3.5"
base64 = "0.22"
enigo = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# 本机性能采集（给语音模型打标签）
sysinfo = { workspace = true }
# L0 同音纠错：汉字→拼音
pinyin = "0.11"
# B6 繁简转换：纯 Rust OpenCC 实现（字典编译进二进制）
ferrous-opencc = "0.4"
# D3 文件转录：纯 Rust 音频解码（mp3/wav/flac/ogg）
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "pcm"] }
# 后续扩展 L0 同音字：pinyin / jieba-rs（届时再引入）
# 模型下载：stream 特性用于流式进度；rustls 避免系统 TLS 依赖。
reqwest = { workspace = true, features = ["stream"] }
# R3：endpoint URL 解析（host/IP 分类）。
url = "2"
bytes = "1"
sherpa-onnx = { version = "1.13", optional = true }
# 本地 GGUF 推理（Qwen3.5/MiLMMT/HY-MT 等）；仅 llm feature。
llama-cpp-2 = { version = "0.1", optional = true, default-features = true }
# token_to_piece 的 UTF-8 解码器（llm feature 内使用）。
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "voice_core"
path = "src/lib.rs"
