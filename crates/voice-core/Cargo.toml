[package]
name = "voice-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform voice-input engine core (no Tauri dependency)"

[features]
default = []
# 本地 sherpa-onnx ASR（重型原生依赖，按需开启）。
sherpa = ["dep:sherpa-onnx"]
# 本地 GGUF 润色（llama.cpp，二期；编译较重）。
llm = ["dep:llama-cpp-2"]

[dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
tokio-tungstenite = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
hound = "3.5"
enigo = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
# 本机性能采集（给语音模型打标签）
sysinfo = { workspace = true }
# 后续扩展 L0 同音字：pinyin / jieba-rs（届时再引入）
# 模型下载：stream 特性用于流式进度；rustls 避免系统 TLS 依赖。
reqwest = { workspace = true, features = ["stream"] }
bytes = "1"
sherpa-onnx = { version = "1.13", optional = true }
# 本地 GGUF 推理（Qwen2.5-1.5B 等）；仅 llm feature。
llama-cpp-2 = { version = "0.1", optional = true, default-features = true }

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tempfile = { workspace = true }

[lib]
name = "voice_core"
path = "src/lib.rs"
