name: Release

# 多平台打包 + GitHub Release。
# 触发：push 版本 tag（v0.2.0）→ 先跑测试门禁，全绿后构建 macOS dmg + Windows
# NSIS 安装包并发布。只有 tag 才打包；失败重试用 run 的 Re-run，不再提供
# workflow_dispatch 手动触发（无 tag 打包会绕过「tag 才打包」的约定）。
#
# 签名策略（内测版）：
# - macOS：CI 一次性自签（openIME CI Signing），非 Developer ID 公证，
#   首次打开需 右键→打开。正式公证后续接入 Apple 证书 secrets。
# - Windows：未签名（SmartScreen 提示未知发布者），有证书后补签名 step。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── 版本校验：tag 与 tauri.conf.json version 必须一致 ──
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v5
      - name: 校验 tag 与版本一致
        id: check
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          CONF_VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "tauri.conf version: $CONF_VERSION"
          if [[ "$TAG" != v* ]]; then
            echo "错误：Release 仅由 v* tag 触发，当前 ref：$TAG" >&2
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          if [[ "$TAG_VERSION" != "$CONF_VERSION" ]]; then
            echo "错误：tag $TAG 与 tauri.conf.json version $CONF_VERSION 不一致。" >&2
            echo "请先同步三处版本（workspace Cargo.toml / src-tauri/tauri.conf.json / package.json）再打 tag。" >&2
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  # ── 测试门禁：打包前强制全绿（与 ci.yml 同口径的 voice-core + 前端） ──
  test:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # 与 ci.yml voice-core Linux job 同款系统依赖（cpal → alsa-sys 需要）。
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Clippy + test voice-core（默认 feature）
        run: |
          cargo clippy -p voice-core --all-targets -- -D warnings
          cargo test -p voice-core --all-targets
      - name: Clippy + test voice-core（sherpa feature）
        run: |
          cargo clippy -p voice-core --features sherpa --all-targets -- -D warnings
          cargo test -p voice-core --features sherpa --all-targets
      - name: Frontend vitest + build
        run: |
          pnpm test
          pnpm build

  # ── macOS：临时自签 + dmg ──
  build-macos:
    needs: [version-check, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-release
      - name: Install cmake (llama.cpp / llm feature)
        run: brew install cmake
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: 创建 CI 临时签名身份
        shell: bash
        run: |
          source ./scripts/ci-sign-macos.sh
          echo "CI_SIGNING_IDENTITY=${CI_SIGNING_IDENTITY}" >> "$GITHUB_ENV"
      - name: 构建 macOS .app
        shell: bash
        env:
          # updater 签名（createUpdaterArtifacts 产出 .app.tar.gz + .sig）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build \
            --features custom-protocol,sherpa,llm \
            --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${CI_SIGNING_IDENTITY}\"}}}"
      - name: 生成 dmg + 收集更新产物
        shell: bash
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          mkdir -p dist-release
          hdiutil create -volname openIME \
            -srcfolder target/release/bundle/macos/openIME.app \
            -ov -format UDZO \
            "dist-release/openIME_${VERSION}_aarch64.dmg"
          # 自动更新产物（minisign 签名，latest.json 引用）
          cp target/release/bundle/macos/openIME.app.tar.gz \
            "dist-release/openIME_${VERSION}_aarch64.app.tar.gz"
          cp target/release/bundle/macos/openIME.app.tar.gz.sig \
            "dist-release/openIME_${VERSION}_aarch64.app.tar.gz.sig"
          ls -la dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: openime-macos
          path: dist-release/

  # ── Windows：未签名 + NSIS ──
  build-windows:
    needs: [version-check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-release
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      # TSF DLL 是本地构建产物（src-tauri/ime/ 已 gitignore）：tauri-build 的资源
      # 校验先于 build.rs 编译真 DLL，先放占位通过校验；随后 build.rs 用 cl.exe
      # 产出的真 DLL 会覆盖占位并打入安装包（与 ci.yml windows job 同套路）。
      - name: Stub git-ignored TSF resource
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/ime | Out-Null
          Set-Content -Path src-tauri/ime/OpenImeTsf.dll -Value "stub"
      - name: 构建 Windows NSIS 安装包
        shell: bash
        env:
          # updater 签名（对 setup.exe 产出 .sig，latest.json 引用）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # 不带 llm：llama.cpp(cmake 默认 /MD) 与 sherpa-onnx 预编译库(静态 /MT)
          # CRT 混链报 LNK2038（无 feature 级开关，待在 Windows 上专项修复）。
          # Windows 润色走云端；此组合与 build-windows.ps1 无 cmake 回退一致。
          pnpm tauri build --features custom-protocol,sherpa
      - name: 收集安装包与更新签名
        shell: bash
        run: |
          mkdir -p dist-release
          cp target/release/bundle/nsis/*.exe dist-release/
          cp target/release/bundle/nsis/*.sig dist-release/
          ls -la dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: openime-windows
          path: dist-release/

  # ── GitHub Release ──
  release:
    # 需显式含 version-check：latest.json / release 名称要用它的 outputs。
    needs: [version-check, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: 生成 latest.json（应用内自动更新的更新源）
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          cd dist-release
          python3 - "$VERSION" <<'EOF'
          import datetime, json, sys
          version = sys.argv[1]
          base = f"https://github.com/rhythm1995/openIME/releases/download/v{version}"
          def sig(p):
              with open(p) as f:
                  return f.read().strip()
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": sig(f"openIME_{version}_aarch64.app.tar.gz.sig"),
                      "url": f"{base}/openIME_{version}_aarch64.app.tar.gz",
                  },
                  "windows-x86_64": {
                      "signature": sig(f"openIME_{version}_x64-setup.exe.sig"),
                      "url": f"{base}/openIME_{version}_x64-setup.exe",
                  },
              },
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f)
          EOF
          cat latest.json
      - name: 生成 sha256
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          ls -la
      - name: 创建/更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "openIME ${{ needs.version-check.outputs.version }}"
          tag_name: ${{ needs.version-check.outputs.tag_name }}
          draft: false
          # 必须正式 release：updater 更新源 releases/latest/download/latest.json
          # 不解析 prerelease。
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
