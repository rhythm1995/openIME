name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# main 连续推送时自动取消过时的 run，省 runner 时长（PR 各自有独立 group）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 核心 Rust crate：单测 + 集成测试，三平台。
  core:
    name: voice-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # fmt 结果与平台无关，只在 ubuntu 跑一次（mac/win 的 rustfmt 检查是冗余）。
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy -p voice-core --all-targets -- -D warnings
      - name: Test voice-core
        run: cargo test -p voice-core --all-targets
      - name: Clippy voice-core with sherpa feature (deny warnings)
        run: cargo clippy -p voice-core --features sherpa --all-targets -- -D warnings
      - name: Test voice-core with sherpa feature
        run: cargo test -p voice-core --features sherpa --all-targets

  # Tauri 壳：编译检查（需要 dist 前端产物 + 图标）。
  tauri-shell:
    name: src-tauri build check (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install cmake (for llama.cpp / llm feature)
        run: brew install cmake
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      - name: Clippy src-tauri
        run: cargo clippy -p openime -- -D warnings
      - name: cargo check src-tauri
        run: cargo check -p openime

  # Tauri 壳：Windows 编译检查。
  # 必要性：macOS 专属 API（ActivationPolicy / RunEvent::Reopen 等）与
  # windows-rs 0.58 类型漂移（HWND/PWSTR）只在 Windows 编译时暴露——
  # 此 job 兜住这类回归（此前 src-tauri 只在 macOS 编译，Windows 编译错误长期无人发现）。
  tauri-shell-windows:
    name: src-tauri build check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build
      # TSF DLL 是本地构建产物（src-tauri/ime/ 已 gitignore），
      # tauri-build 只验证资源路径存在；check/clippy 不消费其内容，放置占位即可。
      - name: Stub git-ignored TSF resource
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/ime | Out-Null
          Set-Content -Path src-tauri/ime/OpenImeTsf.dll -Value "stub"
      # 门禁与 macOS job 对齐：clippy -D warnings（2026-08-14 全 workspace clippy 清零后启用）。
      - name: Clippy src-tauri
        run: cargo clippy -p openime -- -D warnings
      - name: cargo check src-tauri (default features incl. sherpa)
        run: cargo check -p openime
      # Windows 专属单元测试（platform/windows 的 focus/permissions/uia、
      # windows_ime 纯协议层）。注册表测试在本机/CI 默认放行场景下可过；
      # 依赖桌面交互的场景（UIA）只做 no-panic 冒烟断言。
      - name: cargo test src-tauri
        run: cargo test -p openime

  # 前端：Vitest。
  frontend:
    name: frontend vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check + build
        run: pnpm build

  # 官网：类型检查 + 构建（部署在 pages.yml，这里覆盖 PR 与非 website 路径的 main 推送）。
  website:
    name: website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install website deps
        run: pnpm install --frozen-lockfile --filter openime-website...
      - name: Type check + build
        run: pnpm --filter openime-website build
