<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>
  <style>
    .cap{fill:#f5f5f7;font:600 22px -apple-system,"PingFang SC",sans-serif}
    .sub{fill:#6e6e73;font:400 14px -apple-system,"PingFang SC",sans-serif}
    .lbl{fill:#a1a1a6;font:500 12px -apple-system,monospace;letter-spacing:1px}
    .hex{fill:#5C6AFF;font:500 13px -apple-system,monospace}
  </style>
  <rect width="1200" height="500" fill="url(#wall)"/>
  <text x="600" y="50" text-anchor="middle" class="cap">openIME · 最终 Logo &amp; VI</text>
  <text x="600" y="74" text-anchor="middle" class="sub">粒蓝 #3B4FE0 · 声波隐喻 · 极简编辑风</text>

  <!-- App icon 256 -->
  <g transform="translate(120,150)">
    <image href="../src-tauri/icons/icon.iconset/icon_256x256.png" width="200" height="200"/>
    <text x="100" y="232" text-anchor="middle" class="lbl">APP ICON · 256</text>
    <text x="100" y="252" text-anchor="middle" class="sub">Dock / Finder</text>
  </g>

  <!-- 侧栏 logo 放大 -->
  <g transform="translate(450,170)">
    <rect x="-20" y="-20" width="240" height="170" rx="14" fill="#18181b"/>
    <g transform="translate(20,30)">
      <svg viewBox="0 0 1024 1024" width="56" height="56">
        <rect width="1024" height="1024" rx="226" fill="#3B4FE0"/>
        <g fill="#fff">
          <rect x="300" y="422" width="56" height="180" rx="28"/>
          <rect x="392" y="362" width="56" height="300" rx="28"/>
          <rect x="484" y="302" width="56" height="420" rx="28"/>
          <rect x="576" y="362" width="56" height="300" rx="28"/>
          <rect x="668" y="422" width="56" height="180" rx="28"/>
        </g>
      </svg>
      <text x="74" y="26" fill="#f5f5f7" font-family="-apple-system" font-size="20" font-weight="600">openIME</text>
      <text x="74" y="48" fill="#6e6e73" font-family="-apple-system" font-size="11">侧栏 brand-logo</text>
    </g>
    <text x="100" y="172" text-anchor="middle" class="lbl">SIDEBAR LOGO</text>
  </g>

  <!-- 菜单栏模拟 -->
  <g transform="translate(800,170)">
    <rect x="-20" y="-20" width="280" height="60" rx="10" fill="#1d1d1f"/>
    <image href="../src-tauri/icons/menubar-template@2x.png" x="10" y="8" width="24" height="24"/>
    <text x="44" y="28" fill="#f5f5f7" font-family="-apple-system" font-size="13">菜单栏 (template)</text>
    <text x="100" y="88" text-anchor="middle" class="lbl">MENUBAR · TEMPLATE</text>
    <text x="100" y="108" text-anchor="middle" class="sub">随明暗自动反色</text>
  </g>

  <!-- 配色条 -->
  <g transform="translate(120,400)">
    <text x="0" y="0" class="lbl">BRAND COLOR</text>
    <rect x="0" y="12" width="60" height="40" rx="8" fill="#3B4FE0"/>
    <text x="70" y="36" class="hex">#3B4FE0</text>
    <text x="70" y="52" class="sub">粒蓝 Indigo · 浅色模式</text>
    <rect x="300" y="12" width="60" height="40" rx="8" fill="#5C6AFF"/>
    <text x="370" y="36" class="hex">#5C6AFF</text>
    <text x="370" y="52" class="sub">粒蓝亮调 · 深色模式</text>
    <rect x="620" y="12" width="60" height="40" rx="8" fill="#FFFFFF" stroke="#2c2c2e"/>
    <text x="690" y="36" fill="#a1a1a6" font-family="monospace" font-size="13">#FFFFFF</text>
    <text x="690" y="52" class="sub">波形 · 纯白</text>
  </g>
</svg>
