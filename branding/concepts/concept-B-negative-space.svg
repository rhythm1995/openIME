<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle">
      <path d="M 512 64
        C 256 64, 140 92, 92 140
        C 44 188, 64 256, 64 512
        C 64 768, 44 836, 92 884
        C 140 932, 256 960, 512 960
        C 768 960, 884 932, 932 884
        C 980 836, 960 768, 960 512
        C 960 256, 980 188, 932 140
        C 884 92, 768 64, 512 64 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="#3B4FE0"/>
  </g>

  <!-- 概念 B：竖条波形 + 字母 o 的负空间融合
       7 条竖条横跨，但中央两条之间留出一个圆形负空间（=字母 o），
       形成"声波中浮现 o（openIME 首字母）"的双层语义。
       圆形负空间同时是声波的"波谷缺口"。 -->

  <!-- 7 条白色竖条：条宽 44，间距 28，总宽 7*44+6*28 = 476，起 x=274 -->
  <!-- 高度以中心对称：120/200/280/—(圆)—/280/200/120；圆角 22 -->
  <g fill="#FFFFFF">
    <!-- bar1: 高120 -->
    <rect x="274" y="452" width="44" height="120" rx="22"/>
    <!-- bar2: 高200 -->
    <rect x="346" y="412" width="44" height="200" rx="22"/>
    <!-- bar3: 高280 -->
    <rect x="418" y="372" width="44" height="280" rx="22"/>
    <!-- bar4 中央被圆形负空间替换，不画 -->
    <!-- bar5: 高280 -->
    <rect x="562" y="372" width="44" height="280" rx="22"/>
    <!-- bar6: 高200 -->
    <rect x="634" y="412" width="44" height="200" rx="22"/>
    <!-- bar7: 高120 -->
    <rect x="706" y="452" width="44" height="120" rx="22"/>
  </g>

  <!-- 中央圆形负空间：用粒蓝圆盖住中央，形成 "o"
       圆心 (512,512)，半径 56 -->
  <circle cx="512" cy="512" r="56" fill="#3B4FE0"/>
  <!-- 给 o 加一个细白描边强调"字母"语义 -->
  <circle cx="512" cy="512" r="56" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</svg>
