[package]
name = "openime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "openIME - cross-platform voice input method (macOS first)"

[lib]
name = "openime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# 核心库（workspace 内）
voice-core = { path = "../crates/voice-core" }

# Tauri v2
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

# 异步 / 序列化
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
# H2 凭据钥匙串（API key 存系统 keychain，不落明文 JSON）
keyring = "3"
# R7：剪贴板（粘贴兜底 + 750ms 恢复）。只在薄壳，不进 voice-core。
arboard = "3"
# P1：QA 状态机 / 插入器 trait 实现
async-trait = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# R7：Win32 前台 exe 捕获 / 还焦（GetForegroundWindow / SetForegroundWindow）。
# R7/Win：UI Automation 读焦点选区（UIA_TextPattern）+ COM 初始化。
# Gdi/LibraryLoader：真机行为测试创建真实窗口（RegisterClassW / CreateWindowExW）用。
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }
# R7：Ctrl+V 粘贴兜底（insert_fallback::windows_ctrl_v 直接 `use enigo::`，
# 需作为本 crate 直属依赖；enigo 0.5 在 Windows 自动启用 Win32 后端）。
enigo = { workspace = true }
# 系统权限兼容：读 CapabilityAccessManager ConsentStore 判定麦克风授权状态。
winreg = "0.55"

[features]
# 默认走自定义协议（生产）+ 本地 sherpa-onnx；开发时 tauri 会注入 devUrl
# llm（本地 GGUF 润色）需系统 cmake + Metal；有环境时：cargo build -p openime --features llm
default = ["custom-protocol", "sherpa"]
custom-protocol = ["tauri/custom-protocol"]
# 本地 sherpa-onnx 引擎（转发到 voice-core）；默认开启。关闭：--no-default-features --features custom-protocol
sherpa = ["voice-core/sherpa"]
# 本地 GGUF 润色（llama.cpp，需 cmake）
llm = ["voice-core/llm"]

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 权限：辅助功能 + 麦克风授权状态
core-foundation = "0.10"
